<div class="confirm-overlay" *ngIf="visible" (click)="annuler.emit()">
  <div class="confirm-box" (click)="$event.stopPropagation()">
    <div class="confirm-icon">!</div>
    <h3>{{ titre }}</h3>
    <p>{{ message }}</p>

    <div class="confirm-actions">
      <button class="btn-cancel" (click)="annuler.emit()" [disabled]="enCours">{{ texteAnnuler }}</button>
      <button class="btn-confirm" (click)="confirmer.emit()" [disabled]="enCours">
        {{ enCours ? 'Suppression...' : texteConfirmer }}
      </button>
    </div>
  </div>
</div>
