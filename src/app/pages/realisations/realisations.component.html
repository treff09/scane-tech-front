<section class="section">
  <div class="container">
    <div class="section-head" appReveal>
      <span class="eyebrow">{{ 'section.references.eyebrow' | t }}</span>
      <h2>{{ 'section.references.title' | t }}</h2>
    </div>
    <div class="client-carousel" appReveal>
      <div class="client-track">
        <ng-container *ngFor="let repetition of [0,1,2,3,4,5]">
          <div class="client-logo" *ngFor="let c of clients">
            <img [src]="c.logo" [alt]="c.nom">
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</section>

<hr class="divider">

<section class="section">
  <div class="container">
    <div class="section-head" appReveal>
      <span class="eyebrow">{{ 'section.realisations.eyebrow' | t }}</span>
      <h2>{{ 'section.realisations.title' | t }}</h2>
    </div>

    <div class="realisations-grid" *ngIf="realisations.length; else emptyState">
      <div class="realisation-card reveal-img" appReveal *ngFor="let r of realisations">
        <img [src]="r.image || 'assets/images/facade-scane-tech.jpeg'" [alt]="r.titre">
        <div class="realisation-info">
          <h4>{{ r.titre | bilingual:r.titre_en }}</h4>
          <p *ngIf="r.client">{{ r.client }}</p>
        </div>
      </div>
    </div>

    <ng-template #emptyState>
      <p class="realisation-note" appReveal>{{ 'realisations.note' | t }}</p>
    </ng-template>
  </div>
</section>
